name: IT Feature Request
description: Propose a new IT feature for the SIS, portal, or related systems.
title: "[IT Feature] "
labels: ["it-backlog"]
assignees: []
body:
  - type: input
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: "Bursars currently have to switch between two screens to reconcile a payment."
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: How should the feature work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches considered and why this one is preferred.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who benefits, how often, and how much.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Who should be reached for follow-up questions?
    validations:
      required: false
