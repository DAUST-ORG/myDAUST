name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Without this the ~21 database-backed suites self-skip, and a green CI says
    # nothing about the approval rail, the money paths, guardians or admissions.
    # That gap let seven finance-approval tests rot unnoticed until they were
    # found broken on main.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mydaust
          POSTGRES_PASSWORD: mydaust
          POSTGRES_DB: mydaust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydaust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace consumers typecheck against built artifacts: shared's .d.ts and
      # the generated Prisma client. DATABASE_URL is a dummy (generate needs the
      # schema, not a live DB).
      - name: Build workspace packages
        run: |
          pnpm --filter @mydaust/shared run build
          DATABASE_URL="postgresql://x:x@localhost:5432/x" pnpm --filter @mydaust/db run build

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Unit tests (shared)
        run: pnpm --filter @mydaust/shared exec vitest run

      # TEST_DATABASE_URL turns on the integration suites. vitest.config.ts
      # serialises files when it is set, because each suite migrates its own
      # throwaway schema against this one server.
      - name: Unit and integration tests (api)
        env:
          TEST_DATABASE_URL: postgresql://mydaust:mydaust@localhost:5432/mydaust
        run: pnpm --filter @mydaust/api exec vitest run
