name: Deploy

# develop -> staging, main -> prod. CI only bumps images and rolls services;
# infrastructure changes stay operator-run via OpenTofu (see infra/).
on:
  push:
    branches: [develop, main]
  # Manual trigger: deploy the selected ref's env on demand (develop -> staging, main -> prod).
  # Forces the app + vitrine jobs regardless of the path filter.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC -> daust-github-deploy role
  contents: read

env:
  AWS_REGION: us-east-1
  ECR: 961828155948.dkr.ecr.us-east-1.amazonaws.com
  ROLE_ARN: arn:aws:iam::961828155948:role/daust-github-deploy
  # Branch -> environment mapping
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
  API_ORIGIN: ${{ github.ref_name == 'main' && 'https://my.daust.net' || 'https://daust-staging.azt.dev' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch forces every deploy job; otherwise the path filter decides.
      app: ${{ steps.filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      vitrine: ${{ steps.filter.outputs.vitrine == 'true' || github.event_name == 'workflow_dispatch' }}
      tunnel: ${{ steps.filter.outputs.tunnel == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      # Full history so paths-filter diffs against the real previous commit, not the default branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.2
        id: filter
        with:
          filters: |
            app:
              - 'apps/api/**'
              - 'apps/portal/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            vitrine:
              - 'apps/vitrine/**'
              - 'packages/shared/**'
            tunnel:
              - 'infra/tunnel/**'
              - 'infra/tunnel-prod/**'
              - '.github/workflows/deploy.yml'

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # ARM64 images; if the org plan lacks arm runners, switch to ubuntu-latest
    # + docker/setup-qemu-action (slow until the api image is slimmed).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR"

      - name: Build and push images
        run: |
          TAG="${GITHUB_SHA::7}-${GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Images are environment-agnostic (api reads config from Secrets Manager at runtime;
          # portal is built with a relative NEXT_PUBLIC_API_URL for both envs), so a tag already
          # in ECR is a valid artifact for this env too. Promoting develop -> main is usually a
          # fast-forward, which means the SAME sha deploys to staging then prod; ECR tags are
          # immutable, so re-pushing would fail. Skip the rebuild and promote what's there.
          # Uses batch-get-image, not describe-images: only the former is granted to the deploy
          # role (see infra/global/main.tf), and a permission error here would look like "absent"
          # and send us into a push that is guaranteed to fail.
          have() {
            [ "$(aws ecr batch-get-image --repository-name "$1" --image-ids imageTag="$TAG" \
                 --query 'length(images)' --output text 2>/dev/null || echo 0)" != "0" ]
          }
          if have daust-api && have daust-portal; then
            echo "Images for $TAG already in ECR - promoting existing artifact."
            exit 0
          fi
          docker build -f apps/api/Dockerfile -t "$ECR/daust-api:$TAG" .
          docker build -f apps/portal/Dockerfile --build-arg NEXT_PUBLIC_API_URL="" -t "$ECR/daust-portal:$TAG" .
          docker push "$ECR/daust-api:$TAG"
          docker push "$ECR/daust-portal:$TAG"

      - name: Run migrations (one-off ECS task on the freshly built image)
        run: |
          CLUSTER="daust-$ENV_NAME"
          # The migration files live in THIS build's image, so migrate MUST run the new image.
          # run-task can't override the image, so register a task def carrying it while keeping
          # the current def's DATABASE_URL secret + network config. (Running the current/old
          # task def here silently skips new migrations — the client then 500s on the new columns.)
          CUR=$(aws ecs describe-services --cluster "$CLUSTER" --services "daust-$ENV_NAME-api" \
                --query 'services[0].taskDefinition' --output text)
          NET=$(aws ecs describe-services --cluster "$CLUSTER" --services "daust-$ENV_NAME-api" \
                --query 'services[0].networkConfiguration' --output json)
          aws ecs describe-task-definition --task-definition "$CUR" --query 'taskDefinition' --output json \
            | jq --arg img "$ECR/daust-api:$TAG" \
                 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
                  | .containerDefinitions[0].image = $img' > migtd.json
          MIGTD=$(aws ecs register-task-definition --cli-input-json file://migtd.json \
                --query 'taskDefinition.taskDefinitionArn' --output text)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIGTD" \
                --launch-type FARGATE --network-configuration "$NET" \
                --overrides '{"containerOverrides":[{"name":"api","command":["node","node_modules/prisma/build/index.js","migrate","deploy","--schema=node_modules/@mydaust/db/prisma/schema.prisma"]}]}' \
                --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migration exit code: $EXIT"
          [ "$EXIT" = "0" ]
          # Reused by the reference-data step below; both need the same new-image
          # task def and the service's VPC config to reach the SG-locked database.
          echo "MIGTD=$MIGTD" >> "$GITHUB_ENV"
          echo "NET<<EOF" >> "$GITHUB_ENV"
          echo "$NET" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Load SIS reference data (one-off ECS task)
        run: |
          CLUSTER="daust-$ENV_NAME"
          # Grading scales, catalogue years, degree requirements and the fee schedule
          # are official configuration, not demo data. bootstrap-prod only runs against
          # an empty database, so an environment bootstrapped before the SIS redesign
          # would never receive them and those screens render empty. This loader is
          # idempotent (upserts on natural keys) and asserts that no student, invoice
          # or payment row changed before it exits, so it is safe on every deploy.
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIGTD" \
                --launch-type FARGATE --network-configuration "$NET" \
                --overrides '{"containerOverrides":[{"name":"api","command":["node","node_modules/tsx/dist/cli.mjs","node_modules/@mydaust/db/prisma/load-sis-reference.ts"]}]}' \
                --query 'tasks[0].taskArn' --output text)
          echo "reference-data task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].containers[0].exitCode' --output text)
          echo "reference-data exit code: $EXIT"
          # Deliberately fails the deploy: a non-zero exit here means either the load
          # broke or its money-row assertion tripped, and both are worth stopping for.
          [ "$EXIT" = "0" ]

      - name: Roll API to the new image
        run: |
          CLUSTER="daust-$ENV_NAME"
          SERVICE="daust-$ENV_NAME-api"
          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].taskDefinition' --output text)
          # Keep the portal on its last stable image until this API revision passes
          # ALB health checks and the post-deploy accounting reconciliation below.
          aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition' --output json \
            | jq --arg img "$ECR/daust-api:$TAG" \
                 --arg transcript_bucket "daust-$ENV_NAME-transcript-imports-961828155948" \
                 --arg vitrine_origin "$([ "$ENV_NAME" = "prod" ] && echo 'https://daust.org' || echo 'https://daust.azt.dev')" \
                 --arg additional_cors_origins "$([ "$ENV_NAME" = "prod" ] && echo 'https://daust.net,https://www.daust.org' || echo '')" \
                 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
                  | .containerDefinitions[0].image = $img
                  | .containerDefinitions[0].environment =
                      ((.containerDefinitions[0].environment // [])
                       | map(select(
                           .name != "TRANSCRIPT_IMPORT_BUCKET"
                           and .name != "VITRINE_ORIGIN"
                           and .name != "ADDITIONAL_CORS_ORIGINS"
                         ))
                       + [
                           {"name":"TRANSCRIPT_IMPORT_BUCKET","value":$transcript_bucket},
                           {"name":"VITRINE_ORIGIN","value":$vitrine_origin},
                           {"name":"ADDITIONAL_CORS_ORIGINS","value":$additional_cors_origins}
                         ])' > api-td.json
          NEW=$(aws ecs register-task-definition --cli-input-json file://api-td.json \
                --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW" >/dev/null
          echo "api -> $NEW"

      - name: Wait for API rollout + health check
        run: |
          CLUSTER="daust-$ENV_NAME"
          # services-stable is the real gate: ECS only reports stable once the new
          # tasks pass the ALB target-group health checks.
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "daust-$ENV_NAME-api"
          # Best-effort edge check; non-fatal while the Cloudflare hostname is still being wired.
          if curl -sf "$API_ORIGIN/api/health" | grep -q '"ok":true'; then
            echo "edge health OK ($API_ORIGIN)"
          else
            echo "edge health check skipped ($API_ORIGIN not resolving yet); services are stable."
          fi

      - name: Reconcile installment statuses (one-off ECS task)
        run: |
          CLUSTER="daust-$ENV_NAME"
          SERVICE="daust-$ENV_NAME-api"
          # Re-query after services-stable so this always uses the API task
          # definition that was actually rolled out, including its secrets and logs.
          TASK_DEF=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          NET=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          LOG_OPTIONS=$(aws ecs describe-task-definition --task-definition "$TASK_DEF" \
            --query "taskDefinition.containerDefinitions[?name=='api'] | [0].logConfiguration.options" \
            --output json)
          LOG_GROUP=$(jq -r '.["awslogs-group"]' <<<"$LOG_OPTIONS")
          LOG_PREFIX=$(jq -r '.["awslogs-stream-prefix"]' <<<"$LOG_OPTIONS")

          RUN_RESULT=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEF" \
            --launch-type FARGATE --network-configuration "$NET" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/finance/reconcile-installment-statuses.cli.js"]}]}')
          TASK=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_RESULT")
          if [ -z "$TASK" ]; then
            echo "ECS did not start the reconciliation task:"
            jq -c '.failures' <<<"$RUN_RESULT"
            exit 1
          fi
          echo "reconciliation task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"

          TASK_RESULT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK")
          EXIT=$(jq -r '.tasks[0].containers[] | select(.name == "api") | .exitCode // empty' <<<"$TASK_RESULT")
          STOP_REASON=$(jq -r '.tasks[0].stoppedReason // "not reported"' <<<"$TASK_RESULT")
          TASK_ID="${TASK##*/}"
          LOG_STREAM="$LOG_PREFIX/api/$TASK_ID"

          # CloudWatch stream creation and final log delivery are eventually consistent.
          # Require the structured result line so a silent task cannot pass deployment.
          printf '{"events":[]}' > reconciliation-logs.json
          for attempt in $(seq 1 15); do
            if aws logs get-log-events --log-group-name "$LOG_GROUP" \
              --log-stream-name "$LOG_STREAM" --start-from-head \
              --output json > reconciliation-logs.json 2>/dev/null \
              && jq -e \
                '[.events[].message | fromjson? | select(.event == "installment-status-reconciliation")] | length > 0' \
                reconciliation-logs.json >/dev/null; then
              break
            fi
            sleep 2
          done

          echo "CloudWatch output ($LOG_GROUP / $LOG_STREAM):"
          jq -r '.events[].message' reconciliation-logs.json
          RESULT=$(jq -c \
            '[.events[].message | fromjson? | select(.event == "installment-status-reconciliation")] | last // empty' \
            reconciliation-logs.json)
          echo "reconciliation exit code: ${EXIT:-not reported}"
          if [ "$EXIT" != "0" ]; then
            echo "reconciliation stopped unsuccessfully: $STOP_REASON"
            exit 1
          fi
          if [ -z "$RESULT" ] || ! jq -e \
            '.ok == true and (.changedCount | type == "number")' \
            <<<"$RESULT" >/dev/null; then
            echo "reconciliation did not emit a valid success result"
            exit 1
          fi
          echo "reconciliation changed count: $(jq -r '.changedCount' <<<"$RESULT")"

      - name: Roll portal to the new image
        run: |
          CLUSTER="daust-$ENV_NAME"
          SERVICE="daust-$ENV_NAME-portal"
          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition' --output json \
            | jq --arg img "$ECR/daust-portal:$TAG" \
                 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
                  | .containerDefinitions[0].image = $img' > portal-td.json
          NEW=$(aws ecs register-task-definition --cli-input-json file://portal-td.json \
                --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW" >/dev/null
          echo "portal -> $NEW"

      - name: Wait for portal rollout
        run: |
          CLUSTER="daust-$ENV_NAME"
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "daust-$ENV_NAME-portal"

  vitrine:
    needs: changes
    if: needs.changes.outputs.vitrine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared + static export
        run: |
          pnpm --filter @mydaust/shared run build
          NEXT_PUBLIC_API_URL="$API_ORIGIN" NEXT_PUBLIC_PORTAL_URL="$API_ORIGIN" \
            pnpm --filter @mydaust/vitrine exec next build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to the environment bucket
        run: aws s3 sync apps/vitrine/out/ "s3://daust-$ENV_NAME-vitrine-961828155948/" --delete

  tunnel:
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR"

      - name: Build and push tunnel image
        run: |
          TAG="${GITHUB_SHA::7}-${GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ "$ENV_NAME" = "prod" ]; then
            TUNNEL_DIR="infra/tunnel-prod"
          else
            TUNNEL_DIR="infra/tunnel"
          fi
          docker build -t "$ECR/daust-tunnel:$TAG" "$TUNNEL_DIR"
          docker push "$ECR/daust-tunnel:$TAG"

      - name: Roll tunnel to the new image
        run: |
          CLUSTER="daust-$ENV_NAME"
          SERVICE="daust-$ENV_NAME-tunnel"
          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition' --output json \
            | jq --arg img "$ECR/daust-tunnel:$TAG" \
                 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
                  | .containerDefinitions[0].image = $img' > tunnel-td.json
          NEW=$(aws ecs register-task-definition --cli-input-json file://tunnel-td.json \
                --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW" >/dev/null
          echo "tunnel -> $NEW"

      - name: Wait for tunnel rollout
        run: |
          aws ecs wait services-stable --cluster "daust-$ENV_NAME" \
            --services "daust-$ENV_NAME-tunnel"
