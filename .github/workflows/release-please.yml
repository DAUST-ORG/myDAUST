name: release-please

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, synchronize, opened, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
